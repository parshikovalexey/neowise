<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    .result-success { color: #166534; background: #f0fdf4; border-left: 4px solid #16a34a; padding: .75rem; }
    .result-error { color: #991b1b; background: #fef2f2; border-left: 4px solid #dc2626; padding: .75rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    function showResult(message, type) {
      result.classList.remove("result-success", "result-error");
      if (type) result.classList.add(`result-${type}`);
      result.textContent = message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.classList.remove("result-success", "result-error");
      result.textContent = "";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const body = await reply.json();

        if (body.status === "ready") {
          showResult(`Тема: ${body.topic}\nЧерновик ответа:\n${body.draft}`, "success");
        } else if (body.status === "manual_review") {
          showResult("Не удалось автоматически обработать заявку. Разберите заявку вручную и ответьте клиенту сами.", "error");
        } else if (body.status === "invalid_input") {
          showResult("Введите текст заявки, чтобы начать разбор.", "error");
        } else {
          showResult("Не удалось разобрать заявку. Попробуйте ещё раз.", "error");
        }
      } catch {
        showResult("Не удалось связаться с сервером. Попробуйте ещё раз.", "error");
      }
    });
  </script>
</body>
</html>
