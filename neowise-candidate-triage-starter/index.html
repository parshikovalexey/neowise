<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { opacity: .6; }
    #status { min-height: 1.5rem; }
    #status[data-kind="progress"] { color: #555; }
    #status[data-kind="error"] { color: #b00020; font-weight: 600; }
    #status[data-kind="ok"] { color: #0a6b2d; }
    dl { margin: 1rem 0 0; }
    dt { font-weight: 600; margin-top: .5rem; }
    dd { margin: .25rem 0 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section aria-live="polite">
    <p id="status"></p>
    <dl id="classification" hidden>
      <dt>Тема</dt>
      <dd id="topic"></dd>
      <dt>Черновик ответа</dt>
      <dd id="draft"></dd>
    </dl>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const classification = document.querySelector("#classification");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function showStatus(message, kind) {
      status.textContent = message;
      status.dataset.kind = kind;
    }

    function clearResult() {
      classification.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      button.disabled = true;
      showStatus("Разбираем заявку…", "progress");

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        let payload = null;
        try {
          payload = await reply.json();
        } catch {
          payload = null;
        }

        if (payload?.status === "ready") {
          topic.textContent = TOPIC_LABELS[payload.topic] ?? payload.topic;
          draft.textContent = payload.draft;
          classification.hidden = false;
          showStatus("Черновик готов. Прочитайте его и решите, что отправлять клиенту.", "ok");
        } else if (payload?.status === "invalid_input") {
          showStatus("Введите текст заявки.", "error");
        } else {
          showStatus("Модель не дала ответ. Разберите заявку вручную и ответьте клиенту сами.", "error");
        }
      } catch {
        showStatus("Сервер не ответил. Разберите заявку вручную и ответьте клиенту сами.", "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
